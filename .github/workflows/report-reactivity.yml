# Report-reactivity sprint (manual dispatch).
# GPU/Modal is reserved only after CPU gates pass (pytest + prepare) and dry_run is false.
# Default dry_run=true stops after CPU prepare and uploads the prepared payload only.
#
# Naming: one stable protocol ID per experiment (ask_mid_trajectory, rename_invariant).
# See experiments/report_reactivity/NAMING.md — run_id is the results folder only.
#
# Paid execution (dry_run=false) requires:
#   1. pinned_payload_sha256 matching the freshly prepared payload sha256 (fail closed).
#   2. For task=rename_invariant: refused until
#      report_reactivity_gates.RENAME_GPU_SCORING_UNLOCKED (no analyzer/results
#      path yet). CPU dry_run/prepare remains allowed.

name: Report reactivity

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Behavior stage to run on Modal after CPU prepare
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - baseline
          - incident
          - replication
      task:
        description: "Canonical protocol ID for prepare.py (ignored for stage=preflight). ask_mid_trajectory | rename_invariant | report | incident"
        required: true
        default: report
        type: choice
        options:
          - report
          - incident
          - ask_mid_trajectory
          - rename_invariant
      model:
        description: Checkpoint to tokenize and score
        required: true
        default: Qwen/Qwen3.8-27B
        type: choice
        options:
          - Qwen/Qwen3.8-27B
          - Qwen/Qwen3.6-27B
      bases:
        description: Grouped bases for prepare.py (min 16; ignored for preflight)
        required: true
        default: 16
        type: number
      split:
        description: Discovery vs locked confirmation payload
        required: true
        default: discovery
        type: choice
        options:
          - discovery
          - locked
      run_id:
        description: Immutable results subdirectory under results/report_reactivity/ (not the protocol ID)
        required: true
        type: string
      batch_size:
        description: GPU scoring batch size (prefer 4; C1 found batch-8 parity failure)
        required: true
        default: 4
        type: number
      dry_run:
        description: If true, stop after CPU pytest+prepare (no Modal/GPU)
        required: true
        default: true
        type: boolean
      pinned_payload_sha256:
        description: "Required when dry_run=false: sha256 of the reviewed prepare payload (must match freshly prepared). Leave empty for dry_run."
        required: false
        default: ""
        type: string
      history_mode:
        description: "Harder games: redundant correct demos (minimal=current balanced priors; redundant=extra correct history cycles)"
        required: true
        default: minimal
        type: choice
        options:
          - minimal
          - redundant

permissions:
  contents: read

concurrency:
  group: report-reactivity
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      UV_CACHE_DIR: /tmp/jspace-uv-cache
      HF_HOME: /tmp/jspace-hf-cache
      STAGE: ${{ inputs.stage }}
      TASK: ${{ inputs.task }}
      MODEL: ${{ inputs.model }}
      BASES: ${{ inputs.bases }}
      SPLIT: ${{ inputs.split }}
      RUN_ID: ${{ inputs.run_id }}
      BATCH_SIZE: ${{ inputs.batch_size }}
      DRY_RUN: ${{ inputs.dry_run }}
      PINNED_PAYLOAD_SHA256: ${{ inputs.pinned_payload_sha256 }}
      HISTORY_MODE: ${{ inputs.history_mode }}
      # Local scratch only (gitignored). On GPU success, modal_report_reactivity
      # also writes results/report_reactivity/<run_id>/prepared.json for permanence.
      PREPARED_PATH: artifacts/prepared/${{ inputs.run_id }}.json
      # Fresh GHA-era study ledger (global ceiling 28.0). Historical
      # results/report_reactivity/reservations.jsonl (~$7.26) stays immutable.
      # score_gpu returns JSON (C13); do not add torch to this CPU job.
      REPORT_REACTIVITY_LEDGER: results/report_reactivity/reservations_gha.jsonl

    steps:
      - name: Check out frozen protocol
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Validate dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          case "$STAGE" in
            preflight|baseline|incident|replication) ;;
            *) echo "invalid stage: $STAGE" >&2; exit 1 ;;
          esac
          if [[ "$(basename -- "$RUN_ID")" != "$RUN_ID" || "$RUN_ID" == "." || "$RUN_ID" == ".." || -z "$RUN_ID" ]]; then
            echo "invalid run_id: $RUN_ID" >&2
            exit 1
          fi
          if [[ "$STAGE" != "preflight" ]]; then
            if ! [[ "$BASES" =~ ^[0-9]+$ ]] || (( BASES < 16 )); then
              echo "bases must be an integer >= 16 (got $BASES)" >&2
              exit 1
            fi
          fi
          if ! [[ "$BATCH_SIZE" =~ ^[0-9]+$ ]] || (( BATCH_SIZE < 1 || BATCH_SIZE > 16 )); then
            echo "batch_size must be an integer in 1..16 (got $BATCH_SIZE)" >&2
            exit 1
          fi
          if [[ "$STAGE" == "replication" && "$SPLIT" != "locked" ]]; then
            echo "replication stage requires split=locked" >&2
            exit 1
          fi
          if [[ "$SPLIT" == "locked" && "$STAGE" != "preflight" && "$TASK" != "incident" ]]; then
            echo "locked confirmation is frozen to the incident contrast only" >&2
            exit 1
          fi
          case "$TASK" in
            report|incident|ask_mid_trajectory|rename_invariant) ;;
            *) echo "invalid task: $TASK" >&2; exit 1 ;;
          esac
          case "$HISTORY_MODE" in
            minimal|redundant) ;;
            *) echo "invalid history_mode: $HISTORY_MODE" >&2; exit 1 ;;
          esac
          if [[ "$TASK" == "incident" && "$HISTORY_MODE" != "minimal" ]]; then
            echo "history_mode applies only to task=report or ask_mid_trajectory" >&2
            exit 1
          fi
          if [[ "$TASK" == "rename_invariant" && "$HISTORY_MODE" != "minimal" ]]; then
            echo "history_mode does not apply to rename_invariant (keep minimal)" >&2
            exit 1
          fi
          if [[ "$TASK" == "ask_mid_trajectory" && "$STAGE" != "preflight" && "$STAGE" != "baseline" ]]; then
            echo "ask_mid_trajectory supports preflight (tokenizer) or baseline stages only" >&2
            exit 1
          fi
          if [[ "$TASK" == "rename_invariant" && "$STAGE" != "preflight" && "$STAGE" != "baseline" ]]; then
            echo "rename_invariant supports preflight (tokenizer) or baseline stages only" >&2
            exit 1
          fi
          # Early fail-closed: rename has no scoring/reporting path yet.
          if [[ "$TASK" == "rename_invariant" && "$DRY_RUN" != "true" ]]; then
            echo "refusing task=rename_invariant with dry_run=false: no complete scoring/reporting path (see report_reactivity_gates.RENAME_GPU_SCORING_UNLOCKED). CPU dry_run remains allowed." >&2
            exit 1
          fi
          if [[ "$DRY_RUN" != "true" ]]; then
            if [[ -z "${PINNED_PAYLOAD_SHA256// }" ]]; then
              echo "dry_run=false requires pinned_payload_sha256 (reviewed prepare hash). Run dry_run=true first, record sha256, then pin it." >&2
              exit 1
            fi
          fi

      - name: Validate repository locally
        run: uv run --extra dev pytest -q

      - name: CPU prepare payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/prepared
          if [[ "$STAGE" == "preflight" ]]; then
            uv run --with 'transformers>=5.5' --with 'huggingface-hub>=0.34' \
              --with 'httpx[socks]>=0.28' --with 'jinja2>=3.1' \
              python experiments/report_reactivity/prepare_preflight.py \
              --model "$MODEL" \
              --output "$PREPARED_PATH"
          else
            uv run --with 'transformers>=5.5' --with 'huggingface-hub>=0.34' \
              --with 'httpx[socks]>=0.28' --with 'jinja2>=3.1' \
              python experiments/report_reactivity/prepare.py \
              --task "$TASK" \
              --model "$MODEL" \
              --bases "$BASES" \
              --split "$SPLIT" \
              --history-mode "$HISTORY_MODE" \
              --output "$PREPARED_PATH"
          fi

      - name: Enforce paid-run gates (rename unlock + pinned prepare sha)
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          # Python gates mirror the bash early checks and compare prepared sha256.
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from jspace_policy.report_reactivity_gates import enforce_paid_run_gates

          dry = os.environ.get("DRY_RUN", "true").lower() in ("1", "true", "yes")
          checked = enforce_paid_run_gates(
              task=os.environ["TASK"],
              dry_run=dry,
              pinned_payload_sha256=os.environ.get("PINNED_PAYLOAD_SHA256", ""),
              prepared_path=Path(os.environ["PREPARED_PATH"]),
          )
          print(checked)
          PY

      - name: Upload prepared payload (dry_run / CPU gate)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v6
        with:
          name: report-reactivity-prepared-${{ inputs.run_id }}-${{ github.run_id }}
          path: artifacts/prepared/${{ inputs.run_id }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Dry-run complete (no Modal/GPU)
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry_run=true; prepared payload uploaded; skipping Modal."
          python3 -c "import json,os; p=json.load(open(os.environ['PREPARED_PATH'])); print('prepared_sha256=', p.get('sha256'))"

      - name: Refuse missing Modal credentials
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"

      - name: Run GPU scoring on Modal
        if: ${{ !inputs.dry_run }}
        run: |
          uv run --extra modal modal run modal_report_reactivity.py \
            --prepared "$PREPARED_PATH" \
            --run-id "$RUN_ID" \
            --stage "$STAGE" \
            --batch-size "$BATCH_SIZE"

      - name: Upload run outputs and reservations
        if: ${{ always() && !inputs.dry_run }}
        uses: actions/upload-artifact@v6
        with:
          name: report-reactivity-${{ inputs.run_id }}-${{ github.run_id }}
          # Includes prepared.json when scoring wrote it (permanent git copy is
          # the source of truth after documentation; this artifact is backup).
          path: |
            results/report_reactivity/${{ inputs.run_id }}
            results/report_reactivity/reservations_gha.jsonl
            results/report_reactivity/reservations.jsonl
            artifacts/prepared/${{ inputs.run_id }}.json
          if-no-files-found: warn
          retention-days: 14
