name: V4 strategic epistemic search

on:
  push:
    branches:
      - research/v4-strategic-epistemic-search
  workflow_dispatch:
    inputs:
      stage:
        description: Maximum stage to run
        required: true
        default: behavior
        type: choice
        options:
          - behavior
          - calibration
          - report
          - confirmation
          - alias
          - ordinal-preflight
          - ordinal-behavior
          - ordinal-report
          - discovery

permissions:
  contents: read

concurrency:
  group: v4-strategic-epistemic-search
  cancel-in-progress: false

jobs:
  run:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-v4-behavior]') || contains(github.event.head_commit.message, '[run-v4-ordinal-preflight]') || contains(github.event.head_commit.message, '[run-v4-ordinal-behavior]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      UV_CACHE_DIR: /tmp/jspace-uv-cache

    steps:
      - name: Check out the frozen protocol
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Refuse missing Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"

      - name: Validate local protocol
        run: uv run --extra dev pytest -q

      - name: Materialize the preregistered dataset
        shell: bash
        run: |
          if test -f configs/v4/strategic_epistemic_search/dataset.json; then
            uv run python -c 'import json; from pathlib import Path; from jspace_policy.strategic_epistemic_search import verify_dataset_payload; c=json.loads(Path("configs/v4/strategic_epistemic_search/experiment.json").read_text()); d=json.loads(Path("configs/v4/strategic_epistemic_search/dataset.json").read_text()); verify_dataset_payload(d, c)'
          else
            uv run --extra modal python -c 'import modal_strategic_epistemic_search as m; m.freeze_dataset()'
          fi

      - name: Validate remote tokenization without GPU
        if: ${{ inputs.stage == 'behavior' }}
        run: uv run --extra modal modal run modal_strategic_epistemic_search.py::preflight

      - name: Validate disjoint-label report prompts without GPU
        if: ${{ inputs.stage == 'report' }}
        run: uv run --extra modal modal run modal_strategic_epistemic_search.py::report_preflight

      - name: Validate held-out confirmation prompts without GPU
        if: ${{ inputs.stage == 'confirmation' }}
        run: uv run --extra modal modal run modal_strategic_epistemic_search.py::report_confirmation_preflight

      - name: Validate response-alias mechanism prompts without GPU
        if: ${{ inputs.stage == 'alias' }}
        run: uv run --extra modal modal run modal_strategic_epistemic_search.py::report_alias_preflight

      - name: Verify frozen ordinal-binding dataset
        if: ${{ startsWith(inputs.stage, 'ordinal-') || contains(github.event.head_commit.message, '[run-v4-ordinal-preflight]') || contains(github.event.head_commit.message, '[run-v4-ordinal-behavior]') }}
        shell: bash
        run: |
          uv run python -c 'import json; from pathlib import Path; from jspace_policy.strategic_epistemic_search import verify_dataset_payload; c=json.loads(Path("configs/v4/strategic_epistemic_search/ordinal_binding_permutation.json").read_text()); d=json.loads(Path("configs/v4/strategic_epistemic_search/ordinal_binding_dataset.json").read_text()); verify_dataset_payload(d, c)'

      - name: Validate ordinal-binding prompts without GPU
        if: ${{ inputs.stage == 'ordinal-preflight' || contains(github.event.head_commit.message, '[run-v4-ordinal-preflight]') }}
        run: uv run --extra modal modal run modal_strategic_epistemic_search.py::ordinal_preflight

      - name: Validate calibration prompts without GPU
        if: ${{ inputs.stage == 'calibration' }}
        run: uv run --extra modal modal run modal_strategic_epistemic_search.py::calibration_preflight

      - name: Run discovery-only competence calibration
        if: ${{ inputs.stage == 'calibration' }}
        run: uv run --extra modal modal run modal_strategic_epistemic_search.py::calibration

      - name: Run behavior screen
        if: ${{ inputs.stage == 'behavior' }}
        run: uv run --extra modal modal run modal_strategic_epistemic_search.py::behavior

      - name: Run disjoint-label report replication
        if: ${{ inputs.stage == 'report' }}
        run: uv run --extra modal modal run modal_strategic_epistemic_search.py::report

      - name: Run held-out trajectory-interference confirmation
        if: ${{ inputs.stage == 'confirmation' }}
        run: uv run --extra modal modal run modal_strategic_epistemic_search.py::report_confirmation

      - name: Run response-alias mechanism test
        if: ${{ inputs.stage == 'alias' }}
        run: uv run --extra modal modal run modal_strategic_epistemic_search.py::report_alias

      - name: Run prospective ordinal-binding behavior
        if: ${{ inputs.stage == 'ordinal-behavior' || contains(github.event.head_commit.message, '[run-v4-ordinal-behavior]') }}
        run: uv run --extra modal modal run modal_strategic_epistemic_search.py::ordinal_behavior

      - name: Run prospective ordinal-binding report
        if: ${{ inputs.stage == 'ordinal-report' }}
        run: uv run --extra modal modal run modal_strategic_epistemic_search.py::ordinal_report

      - name: Analyze prospective ordinal-binding report
        if: ${{ inputs.stage == 'ordinal-report' }}
        shell: bash
        run: |
          uv run python scripts/analyze_v4_ordinal_binding.py \
            results/v4_strategic_epistemic_search/raw/ordinal_binding_report_v1.json \
            --output results/v4_strategic_epistemic_search/analysis/ordinal_binding_report_v1_analysis.json

      - name: Run observational discovery if behavior passed
        if: ${{ inputs.stage == 'discovery' }}
        run: uv run --extra modal modal run modal_strategic_epistemic_search.py::mechanistic

      - name: Download discovery artifacts from Modal
        if: ${{ inputs.stage == 'discovery' && success() }}
        shell: bash
        run: |
          remote_root="$(jq -r '.artifact.root' results/v4_strategic_epistemic_search/raw/mechanistic_v2_manifest.json)"
          volume_path="${remote_root#/artifacts/}"
          mkdir -p results/v4_strategic_epistemic_search/modal_artifacts
          uv run --extra modal modal volume get --force \
            jspace-v4-strategic-epistemic-artifacts \
            "$volume_path" \
            results/v4_strategic_epistemic_search/modal_artifacts

      - name: Upload immutable run outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: v4-strategic-epistemic-${{ inputs.stage || 'behavior' }}-${{ github.run_id }}
          path: results/v4_strategic_epistemic_search
          if-no-files-found: warn
          retention-days: 14
