name: V5-RBG-6 full action trajectory

on:
  push:
    branches:
      - research/issue-11-full-action-trajectory
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-full-action-trajectory
  cancel-in-progress: false

jobs:
  run:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-v5-full-trajectory]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      UV_CACHE_DIR: /tmp/jspace-uv-cache
      HF_HOME: /tmp/jspace-hf-cache

    steps:
      - name: Check out frozen protocol
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Refuse missing Modal credentials
        run: |
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"

      - name: Validate repository locally
        run: uv run --extra dev pytest -q

      - name: Materialize and verify frozen dataset locally
        run: |
          uv run python scripts/freeze_v5_full_action_trajectory.py
          uv run python -c 'import json; from pathlib import Path; from jspace_policy.full_action_trajectory import verify_dataset_payload; c=json.loads(Path("configs/v5/full_action_trajectory/experiment.json").read_text()); d=json.loads(Path("configs/v5/full_action_trajectory/dataset.json").read_text()); verify_dataset_payload(d,c)'

      - name: Render, tokenize, and validate every trajectory branch locally
        run: |
          uv run --with 'transformers>=5.5' --with 'huggingface-hub>=0.34' \
            --with 'httpx[socks]>=0.28' \
            --with 'jinja2>=3.1' \
            python scripts/prepare_v5_full_action_trajectory.py

      - name: Run GPU forward passes on Modal
        run: uv run --extra modal modal run modal_full_action_trajectory.py::behavior

      - name: Analyze outcomes locally
        run: |
          uv run python scripts/analyze_v5_full_action_trajectory.py \
            results/v5_full_action_trajectory/raw/behavior_v1.json \
            --config configs/v5/full_action_trajectory/experiment.json \
            --output results/v5_full_action_trajectory/analysis/behavior_v1_analysis.json

      - name: Upload immutable outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: v5-full-action-trajectory-${{ github.run_id }}
          path: results/v5_full_action_trajectory
          if-no-files-found: warn
          retention-days: 14
