name: V5 revealed-belief games

on:
  push:
    branches:
      - research/v5-revealed-belief-games
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to run
        required: true
        default: behavior
        type: choice
        options:
          - preflight
          - behavior

permissions:
  contents: read

concurrency:
  group: v5-revealed-belief-games
  cancel-in-progress: false

jobs:
  run:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-v5-preflight]') || contains(github.event.head_commit.message, '[run-v5-behavior]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      UV_CACHE_DIR: /tmp/jspace-uv-cache

    steps:
      - name: Check out frozen protocol
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Refuse missing Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"

      - name: Validate frozen protocol and tests
        run: uv run --extra dev pytest -q

      - name: Materialize and verify immutable dataset
        shell: bash
        run: |
          uv run python scripts/freeze_v5_revealed_belief_games.py
          uv run python -c 'import json; from pathlib import Path; from jspace_policy.revealed_belief_games import verify_dataset_payload; c=json.loads(Path("configs/v5/revealed_belief_games/experiment.json").read_text()); d=json.loads(Path("configs/v5/revealed_belief_games/dataset.json").read_text()); m=json.loads(Path("configs/v5/revealed_belief_games/dataset_manifest.json").read_text()); verify_dataset_payload(d, c); assert d["content_sha256"] == m["expected_content_sha256"]; assert len(d["rows"]) == m["expected_contexts"]'

      - name: Validate prompts and one-token continuations
        run: uv run --extra modal modal run modal_revealed_belief_games.py::preflight

      - name: Run behavior screen
        if: ${{ inputs.stage == 'behavior' || contains(github.event.head_commit.message, '[run-v5-behavior]') }}
        run: uv run --extra modal modal run modal_revealed_belief_games.py::behavior

      - name: Analyze behavior screen
        if: ${{ inputs.stage == 'behavior' || contains(github.event.head_commit.message, '[run-v5-behavior]') }}
        run: |
          uv run python scripts/analyze_v5_revealed_belief_games.py \
            results/v5_revealed_belief_games/raw/behavior_v1.json \
            --output results/v5_revealed_belief_games/analysis/behavior_v1_analysis.json

      - name: Upload immutable run outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: v5-revealed-belief-${{ inputs.stage || 'push' }}-${{ github.run_id }}
          path: results/v5_revealed_belief_games
          if-no-files-found: warn
          retention-days: 14
