[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jspace-reporting-policy"
version = "0.1.0"
description = "Causal tests of reporting policies in Jacobian-lens space"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]
modal = ["modal>=1.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/jspace_policy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

